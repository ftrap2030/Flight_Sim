name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The simulator is deliberately stdlib-only, so there is nothing to
      # install. Compiling every module first turns a syntax error into a clear
      # failure rather than an obscure one inside the test runner.
      - name: Byte-compile
        run: python -m compileall -q flight_sim tests main.py

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
